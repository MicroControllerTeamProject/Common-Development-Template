name: Branch Policy

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  validate-source-branch:
    name: Validate source branch
    runs-on: ubuntu-latest
    steps:
      - name: Permit only same-repository release PRs into main
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          echo "Pull request: $SOURCE_BRANCH -> main"
          if [[ ! "$SOURCE_BRANCH" =~ ^release/.+ ]]; then
            echo "::error::Only release/* branches may be merged into main."
            exit 1
          fi
          if [[ "$SOURCE_REPO" != "$TARGET_REPO" ]]; then
            echo "::error::Release PRs must originate from this repository."
            exit 1
          fi
          echo "Branch policy passed."
