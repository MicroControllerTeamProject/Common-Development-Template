name: Jira Traceability

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  validate-jira-branch:
    name: Validate Jira issue key
    runs-on: ubuntu-latest
    steps:
      - name: Check Jira key in work branch
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          case "$SOURCE_BRANCH" in
            feature/*|bugfix/*|fix/*|hotfix/*|task/*)
              if [[ ! "$SOURCE_BRANCH" =~ (^|[/_-])[A-Z][A-Z0-9]+-[1-9][0-9]*($|[/_-]) ]]; then
                echo "::error::Branch must contain a Jira issue key (example: feature/GS-5-description)."
                exit 1
              fi
              echo "Jira issue key found."
              ;;
            *)
              echo "Jira key check not applicable to this branch type."
              ;;
          esac
